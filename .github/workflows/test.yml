name: test-vnstock
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install vnstock
      - run: python -c "from vnstock import Vnstock; print(Vnstock().stock(symbol='HPG', source='VCI').quote.history(start='2026-08-01', end='2026-09-01').tail())"
