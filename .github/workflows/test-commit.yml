name: test-commit
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sinh file ket qua
        shell: python
        run: |
          import json, os, datetime
          os.makedirs("out", exist_ok=True)
          data = {
              "schema_version": "test",
              "generated_at": datetime.datetime.utcnow().isoformat() + "Z",
              "note": "kiem tra co che commit nguoc vao repo",
          }
          with open("out/latest.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=1)
          print("Da ghi out/latest.json")
      - name: Commit va push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/latest.json
          git diff --staged --quiet && echo "Khong co thay doi" && exit 0
          git commit -m "screener: cap nhat ket qua"
          git push
          echo "DA PUSH - file nam tai out/latest.json"
